{% extends 'base.html' %}
{% block title %}Sign in | PFMS Pro{% endblock %}
{% block auth_content %}
<section class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-7 col-lg-5">
            <div class="surface-card p-4 p-lg-5">
                <h1 class="h3 fw-bold mb-2">Welcome back</h1>
                <p class="text-secondary mb-4">Sign in to continue managing your personal finances professionally.</p>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" name="email" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">Sign in</button>
                </form>
                <p class="text-secondary mt-4 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a>.</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
