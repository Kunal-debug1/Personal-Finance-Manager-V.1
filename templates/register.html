{% extends 'base.html' %}
{% block title %}Register | PFMS Pro{% endblock %}
{% block auth_content %}
<section class="container py-5">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-8 col-lg-6">
            <div class="surface-card p-4 p-lg-5">
                <h1 class="h3 fw-bold mb-2">Create your workspace</h1>
                <p class="text-secondary mb-4">Build a secure personal finance command center for accounts, transactions, and goals.</p>
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Full name</label>
                            <input type="text" name="username" class="form-control form-control-lg" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Email address</label>
                            <input type="email" name="email" class="form-control form-control-lg" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Confirm password</label>
                            <input type="password" name="confirm_password" class="form-control form-control-lg" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg mt-4">Create account</button>
                </form>
                <p class="text-secondary mt-4 mb-0">Already have an account? <a href="{{ url_for('login') }}">Sign in</a>.</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
